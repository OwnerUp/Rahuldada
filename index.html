  <style>

    @keyframes portraitPop{0%,100%{transform:scale(1)}8%{transform:scale(1.045)}16%{transform:scale(1)} }
    @keyframes ring{0%,100%{transform:scale(.98);opacity:.38}10%{transform:scale(1.07);opacity:.78}22%{transform:scale(1);opacity:.45}}
    @keyframes cardPop{0%{opacity:0;transform:translateY(10px) scale(.97)}70%{opacity:1;transform:translateY(-2px) scale(1.012)}100%{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes buttonPop{0%,72%,100%{transform:scale(1)}78%{transform:scale(1.035)}84%{transform:scale(.99)}90%{transform:scale(1.012)}}
    @media(max-width:380px){.page{padding:25px 18px 22px;border-radius:26px}.portrait-shell{width:140px;height:140px}.update{min-height:53px}}
